<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kxbyte Brand Identity Concept</title>
    <style>
        :root {
            --bg-dark: #0a0602;
            --orange-bright: #ff5500;
            --orange-glow: #ff8800;
            --orange-dim: rgba(255, 85, 0, 0.15);
            --line-color: rgba(255, 136, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Abstract Pixel Mesh Network */
        .network-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--line-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-color) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 1;
        }

        /* Pixelated Node Component */
        .node {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: var(--orange-bright);
            box-shadow: 0 0 12px var(--orange-glow);
            z-index: 2;
        }

        /* Floating Pixelated Orbs (Glow effects) */
        .orb {
            position: absolute;
            width: 128px;
            height: 128px;
            background: radial-gradient(circle, var(--orange-dim) 0%, transparent 70%);
            border: 2px dashed rgba(255, 85, 0, 0.2);
            image-rendering: pixelated;
            z-index: 2;
            animation: float 8s infinite ease-in-out;
        }

        /* Positioning variations for preview */
        .node-1 { top: 25%; left: 20%; }
        .node-2 { top: 60%; left: 75%; }
        .node-3 { top: 40%; left: 80%; }
        .node-4 { top: 80%; left: 30%; }

        .orb-1 { top: 15%; left: 15%; animation-delay: 0s; }
        .orb-2 { top: 50%; left: 70%; animation-delay: 3s; }

        /* Brand Showcase Card */
        .brand-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 6, 2, 0.8);
            border: 2px solid var(--orange-bright);
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 85, 0, 0.2);
            backdrop-filter: blur(8px);
            max-width: 450px;
            width: 100%;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ffffff;
            margin-bottom: 10px;
            text-transform: lowercase;
        }

        .logo span {
            color: var(--orange-bright);
            text-shadow: 0 0 10px var(--orange-glow);
        }

        .tagline {
            font-size: 0.85rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 25px;
        }

        .pixel-bar {
            height: 4px;
            width: 60px;
            background-color: var(--orange-bright);
            margin: 0 auto;
            box-shadow: 0 0 8px var(--orange-glow);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.05); }
        }
    </style>
</head>
<body>

    <!-- Background Grid Texture -->
    <div class="network-bg"></div>

    <!-- Background Network Elements -->
    <div class="node node-1"></div>
    <div class="node node-2"></div>
    <div class="node node-3"></div>
    <div class="node node-4"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Foreground Interface -->
    <div class="brand-card">
        <div class="logo">kx<span>byte</span></div>
        <div class="tagline">Abstract Node Network</div>
        <div class="pixel-bar"></div>
    </div>

</body>
</html>
